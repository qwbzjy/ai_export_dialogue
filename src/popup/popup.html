<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>AI 对话导出</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <img class="logo" src="../icons/icon128.png" width="32" height="32" alt="" />
      <div class="head-text">
        <h1>AI 对话导出</h1>
        <p class="site" id="site">检测中…</p>
      </div>
    </header>

    <div class="actions" id="actions" hidden>
      <button type="button" class="primary" data-action="export">导出当前对话（Markdown）</button>
      <button type="button" data-action="export-dom">仅用页面内容导出</button>
    </div>

    <p class="note" id="note">只导出当前打开的这个对话。</p>

    <section class="sites">
      <h2>支持的站点</h2>
      <ul id="site-list"></ul>
    </section>

    <p class="privacy">
      数据只在本地处理：token 仅用于调用站点自己的接口，不上传、不保存；导出文件在扩展页内生成。
    </p>

    <script src="popup.js"></script>
  </body>
</html>
